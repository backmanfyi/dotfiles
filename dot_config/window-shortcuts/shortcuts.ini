# macOS window management keyboard shortcuts.
#
# Applied by scripts/window-shortcuts.sh, which chezmoi runs whenever this
# file changes. Each entry becomes an App Shortcut under
# System Settings > Keyboard > Keyboard Shortcuts > App Shortcuts.
#
# Format
#   [section]   a preferences domain. NSGlobalDomain is "All Applications";
#               a bundle id such as com.apple.Safari scopes to one app.
#   key = value the key is the menu item: a bare title ("Minimize") or a
#               full menu path joined with ' > ' ("Window > Move & Resize >
#               Left"). The value is the shortcut spec. Use the full path for
#               the Move & Resize items; bare titles do not bind there.
#
# Shortcut spec
#   Modifiers cmd, ctrl, alt (or opt), shift joined with '+', key last:
#   "ctrl+alt+left". Named keys: left right up down return enter tab escape
#   space delete forwarddelete home end pageup pagedown plus minus equal
#   f1-f19. Anything else is taken as a single literal character.
#
# Caveats
#   Titles are matched against the menu as displayed, so these English names
#   only bind while the macOS UI language is English. Each domain's shortcut
#   dictionary is written wholesale: removing a line here removes the binding
#   on the next apply, and shortcuts added by hand in System Settings for a
#   managed domain are overwritten. Apps pick up changes on relaunch.
#
# Only comment lines that start with '#' or ';' are stripped; '#' inside a
# menu title is kept.

[NSGlobalDomain]

# Halves
Window > Move & Resize > Left = ctrl+alt+left
Window > Move & Resize > Right = ctrl+alt+right
Window > Move & Resize > Top = ctrl+alt+up
Window > Move & Resize > Bottom = ctrl+alt+down

# Quarters
Window > Move & Resize > Top Left = ctrl+alt+u
Window > Move & Resize > Top Right = ctrl+alt+i
Window > Move & Resize > Bottom Left = ctrl+alt+j
Window > Move & Resize > Bottom Right = ctrl+alt+k

# Fill, centre, undo
Window > Move & Resize > Fill = ctrl+alt+return
Window > Move & Resize > Center = ctrl+alt+c
Window > Move & Resize > Return to Previous Size = ctrl+alt+delete
