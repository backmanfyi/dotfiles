# -------------------------------
# TERM Configuration
# -------------------------------
# Default used for TERM inside tmux.
set -g default-terminal "tmux-256color"

# Matches TERM OUTSIDE of tmux. will modify how tmux interacts
# with the terminal we are using.
set -ag terminal-overrides ",tmux-256color:RGB"

# -------------------------------
# General Config
# -------------------------------
# Set focus-event
set -g focus-events on

# Set history to 50000
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Removes grace-period for commands such as movement between panes
set -g repeat-time 0

# Renumbers windows when closed
set -g renumber-windows on

# Remove delay from vim when exiting insert mode with Esc
set -sg escape-time 0

# Visual notification of activity in other windows
set -g monitor-activity on
set -g visual-activity on

# Turn the status bar on
set -g status on

# Set update frequencey (default 15 seconds)
set -g status-interval 5

# center window list for clarity
set -g status-justify centre

# -------------------------------
# Key Bindings
# -------------------------------

# Set prefix key
unbind-key C-b
set -g prefix C-q

# Moving between panes using vim keybindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind H resize-pane -L 20
bind J resize-pane -D 20
bind K resize-pane -U 10
bind L resize-pane -R 10

# Reload Configuration
bind R source-file ${XDG_CONFIG_HOME}/tmux/tmux.conf \; display-message "Config reloaded..."

# Toggle logging of commands.
bind-key H pipe-pane "exec cat >>$HOME/'#S.#I.#P.-tmux.log'" \; display-message 'Started logging to $HOME/#S.#I.#P-tmux.log'
bind-key g pipe-pane \; display-message 'Ended logging to $HOME/#S.#I.#P-tmux.log'

# Session hopping
bind-key s choose-session

# Create new session
bind-key E command-prompt -p "New session name:" "new-session -s '%%'"

# Delete current session without detatching
bind-key X run '/bin/bash ${XDG_CONFIG_HOME}/tmux/scripts/kill_session.sh "#{session_name}" "#{session_id}"'

# Synchronize panes
bind-key y set-window-option synchronize-panes

# Macros
bind-key m command-prompt -p "Run macro:" "run-shell \"${XDG_CONFIG_HOME}/tmux/scripts/macros/%%\""

# Ghostty font-zoom mirror. Ghostty emits a private CSI sequence on
# CMD+= / CMD+- / CMD+0; we catch it as a user-key and update the state
# file the status bar reads.
set -s user-keys[0] "\e[>1z"
set -s user-keys[1] "\e[>2z"
set -s user-keys[2] "\e[>0z"
bind-key -n User0 run-shell -b "${XDG_CONFIG_HOME}/tmux/scripts/zoom.sh in"
bind-key -n User1 run-shell -b "${XDG_CONFIG_HOME}/tmux/scripts/zoom.sh out"
bind-key -n User2 run-shell -b "${XDG_CONFIG_HOME}/tmux/scripts/zoom.sh reset"

# -------------------------------
# Styling
# -------------------------------

# set pane colors - hilight the active pane
set -g pane-border-style fg=black
set -g pane-active-border-style fg=green #base01
# Pane backgrounds inherit the terminal background; the active border colour
# is the focus indicator.

## colorize messages in the command line
set -g message-style bg=default,fg=red

# ----------------------
# Status Bar
# -----------------------

# Colours mirror the dawnfox Ghostty theme.
#   bg     #faf4ed   fg    #575279
#   teal   #286983 (active accent)
#   yellow #ea9d34 (zoom, activity)
#   rose   #b4637a (alerts)
#   sage   #618774 (info)
#   muted  #9893a5 (separators)

set -g status-style fg=#575279,bg=default

# Window list: powerline rounded pill on the active window, plain text otherwise.
#  = U+E0B6 (left rounded),  = U+E0B4 (right rounded) — Nerd Font glyphs.
set-window-option -g window-status-format " #I #W "
set-window-option -g window-status-current-format "#[fg=#286983,bg=default]#[fg=#faf4ed,bg=#286983,bold] #I #W #[fg=#286983,bg=default]"
set-window-option -g window-status-separator ""
set-window-option -g window-status-style fg=#575279,bg=default
set-window-option -g window-status-activity-style fg=#ea9d34,bg=default,bold,none
set-window-option -g window-status-bell-style fg=#b4637a,bg=default,bold

# Status-left: public IP, plus AWS profile/role only when set
set -g status-left-length 80
set -g status-left ' #[fg=#b4637a]#(dig +short myip.opendns.com @resolver1.opendns.com 2>/dev/null || echo "?")#[fg=#9893a5]#(/bin/bash ${XDG_CONFIG_HOME}/tmux/scripts/get-AWS-profile.sh) '

# Status-right: zoom · [TODOS · ] session · date · time
set -g status-right-length 100
set -g status-right '#[fg=#ea9d34]#(cat ${XDG_CACHE_HOME:-$HOME/.cache}/ghostty-zoom 2>/dev/null || echo 12)pt#[fg=#b4637a]#(grep -q "* \[\s\]" $VIMWIKI_ROOT/todos/$(date +"%Y-%m-%d").md && echo " · TODOS") #[fg=#9893a5]· #[fg=#618774]#S #I:#P #[fg=#9893a5]· #[fg=#618774]%Y-%m-%d #[fg=#9893a5]· #[fg=#618774]%H:%M '
