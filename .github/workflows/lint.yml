name: Lint

on:
  push:
  pull_request:

jobs:
  # ── Shell scripts ────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        # severity=error catches real bugs; warnings are for style issues in
        # existing scripts that are out of scope for this pipeline.
        # .tmpl files are intentionally skipped — they contain Go template
        # directives that shellcheck doesn't understand.
        run: |
          find . -name '*.sh' \
            -not -path './.git/*' \
            -not -path './.claude/*' \
            | xargs shellcheck --severity=error

  # ── Zsh config syntax ────────────────────────────────────────────────────────
  zsh-syntax:
    name: zsh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get install -y zsh

      - name: Check zshrc syntax
        run: zsh -n dot_config/zsh/dot_zshrc

      - name: Check zshenv syntax
        run: zsh -n dot_config/zsh/dot_zshenv

  # ── TOML validation ──────────────────────────────────────────────────────────
  toml:
    name: TOML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install taplo
        run: |
          curl -fsSL \
            "https://github.com/tamasfe/taplo/releases/download/0.9.3/taplo-linux-x86_64.gz" \
            | gunzip -c > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo

      - name: Validate starship config
        run: taplo check dot_config/starship/config.toml

  # ── Repo integrity checks ────────────────────────────────────────────────────
  repo-checks:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source-state directories exist
        run: |
          missing=0
          configs=("aerospace" "bat" "ghostty" "git" "go" "nvim" "private_ssh" "starship" "tmux")
          for config in "${configs[@]}"; do
            if [[ ! -e "dot_config/${config}" ]]; then
              echo "MISSING: dot_config/${config}"
              missing=1
            else
              echo "OK: dot_config/${config}"
            fi
          done
          for f in dot_config/zsh/dot_zshrc dot_config/zsh/dot_zshenv; do
            if [[ ! -f "${f}" ]]; then
              echo "MISSING: ${f}"
              missing=1
            else
              echo "OK: ${f}"
            fi
          done
          claude_paths=("CLAUDE.md" "settings.json" "agents" "hooks" "skills" "templates")
          for p in "${claude_paths[@]}"; do
            if [[ ! -e "dot_claude/${p}" ]]; then
              echo "MISSING: dot_claude/${p}"
              missing=1
            else
              echo "OK: dot_claude/${p}"
            fi
          done
          exit "${missing}"

      - name: No hardcoded home directory paths
        # Catches /Users/<name>/ leaking into any tracked file (configs,
        # templates, dotfiles, extensionless includes). Pattern matches the
        # specific username form so the check doesn't trip on its own
        # self-documentation.
        run: |
          if git ls-files | xargs grep -nE '/Users/[a-z][a-z0-9_-]*/' 2>/dev/null; then
            echo ""
            echo "ERROR: hardcoded home directory paths found — use \$HOME, ~, or XDG vars"
            exit 1
          fi
          echo "OK: no hardcoded home paths"
